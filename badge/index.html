<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Badge — BadgeStatus</title>
  <meta name="description" content="Everything you need to know about this Twitch global badge: how to get it, when it's available, and who has it.">
  <link rel="icon" type="image/png" href="/assets/img/logo.png">
  <link rel="apple-touch-icon" href="/assets/img/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/base.css?v=22">
  <link rel="stylesheet" href="/assets/css/components/cards.css?v=22">
  <link rel="stylesheet" href="/assets/css/components/stream.css?v=22">
  <link rel="stylesheet" href="/assets/css/pages/badge.css?v=30">
</head>
<body>
  <div class="bg-waves" id="bgWaves" aria-hidden="true"></div>
  <header class="nav">
    <div class="wrap nav-inner">
      <div class="nav-left">
        <a href="/" class="brand">
          <img src="/assets/img/logo.png" alt="" width="20" height="20">
          <span>BadgeStatus</span>
        </a>
        <span class="nav-sep">/</span>
        <nav class="nav-links">
          <a href="/" class="nav-link">Home</a>
          <a href="/badges/" class="nav-link is-active">Badges</a>
          <a href="/archive/" class="nav-link">Archive</a>
          <a href="/#schedule" class="nav-link">Schedule</a>
          <a href="https://www.twitch.tv/badgestatus" target="_blank" rel="noopener noreferrer" class="nav-link nav-stream" data-live-indicator><span class="stream-dot"></span><span data-live-label>Stream</span></a>
        </nav>
      </div>
    </div>
  </header>

  <main class="wrap main bd-main">
    <div class="bd-loading" id="bdLoading"><span class="spinner"></span></div>

    <div class="bd-missing hidden" id="bdNotFound">
      <h1>Badge not found</h1>
      <p class="muted">It may have been removed or the link is wrong.</p>
      <a href="/badges/" class="btn-white">All badges</a>
    </div>

    <article class="bd hidden" id="bd">
      <nav class="crumbs"><a href="/badges/">Badges</a><span>/</span><span id="bdCrumb"></span></nav>

      <!-- 1. The badge -->
      <header class="bd-hero">
        <img class="bd-hero-img" id="bdHeroImg" alt="" width="96" height="96">
        <h1 id="bdTitle"></h1>
        <div class="bd-badges">
          <span class="bd-state" id="bdState"></span>
          <span class="bd-cost" id="bdCost"></span>
        </div>
        <a class="bd-collection hidden" id="bdCollection" href="/badges/"></a>
      </header>

      <!-- 2. When -->
      <section class="panel bd-when" id="bdWhen">
        <div class="bd-dates">
          <div class="bd-date is-start">
            <span class="bd-date-label">Starts</span>
            <span class="bd-date-value" id="bdStart"></span>
          </div>
          <div class="bd-date is-end">
            <span class="bd-date-label">Ends</span>
            <span class="bd-date-value" id="bdEnd"></span>
          </div>
        </div>
        <div class="bd-progress" id="bdProgressWrap"><div class="bd-progress-fill" id="bdProgress"></div></div>
        <div class="bd-countdown" id="bdCountdown"></div>
      </section>

      <!-- 3. How to get it -->
      <section class="panel bd-how">
        <span class="bd-how-label">How to get it</span>
        <p class="bd-how-text" id="bdHow"></p>
        <div class="bd-facts" id="bdFacts"></div>
      </section>

      <!-- Eligible live streams (only while the badge is available) -->
      <section class="section hidden" id="bdLiveWrap">
        <div class="section-head">
          <h2>Eligible live streams</h2>
          <span class="box-link" id="bdLiveNote"></span>
        </div>
        <div class="bd-live-grid" id="bdLive"></div>
      </section>

      <!-- 4. Details (collapsed) -->
      <details class="panel bd-details">
        <summary>Details</summary>
        <div class="bd-details-body">
          <div class="bd-preview" id="bdPreview">
            <div class="bd-theme" role="group" aria-label="Preview background">
              <button type="button" class="is-active" data-theme="dark">Dark</button>
              <span>/</span>
              <button type="button" data-theme="light">Light</button>
            </div>
            <div class="bd-sizes">
              <figure><img id="bdImg1" alt="" width="18" height="18"><figcaption>1x</figcaption></figure>
              <figure><img id="bdImg2" alt="" width="36" height="36"><figcaption>2x</figcaption></figure>
              <figure><img id="bdImg4" alt="" width="72" height="72"><figcaption>4x</figcaption></figure>
            </div>
            <div class="bd-chat">
              <img id="bdChatImg" alt="" width="18" height="18">
              <span class="bd-chat-user">badgestatus</span><span class="bd-chat-msg">: gg</span>
            </div>
          </div>
          <dl class="bd-data" id="bdData"></dl>
        </div>
      </details>

      <!-- 5. Related -->
      <section class="section hidden" id="bdCampaignWrap">
        <div class="section-head"><h2 id="bdCampaignTitle">Same campaign</h2></div>
        <div class="mini-list" id="bdCampaign"></div>
      </section>

      <section class="section">
        <div class="section-head">
          <h2>Other badges</h2>
          <a href="/badges/" class="box-link">All →</a>
        </div>
        <div class="bd-other-grid" id="bdOther"></div>
      </section>
    </article>
  </main>

  <footer class="footer">
    <div class="wrap footer-inner">
      <span class="footer-links">badgestatus.net <a href="https://www.twitch.tv/badgestatus" target="_blank" rel="noopener noreferrer" class="footer-stream" data-live-indicator><span class="stream-dot"></span>twitch.tv/badgestatus</a></span>
      <span class="muted" id="footerSync"></span>
    </div>
  </footer>

  <div class="toast hidden" id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="/assets/js/pages/badge.js?v=33"></script>
</body>
</html>
