name: Sync Twitch Badges

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync Twitch global badges
        run: python scripts/sync_badges.py

      - name: Commit snapshot changes
        run: |
          if [ -z "$(git status --porcelain data/)" ]; then
            echo "No badge changes detected."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/badges.json data/changelog.json
          git commit -m "Sync Twitch global badges snapshot"
          git push
