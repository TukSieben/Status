name: Sync Twitch Badges

on:
  schedule:
    # Every 15 minutes, off the busy :00/:15/:30/:45 slots (GitHub drops scheduled runs under load).
    # The BadgeStatus bot also triggers this workflow every 15 minutes as a reliable backup.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# Never run two syncs at once (they would race on the push)
concurrency:
  group: sync-badges
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow (badge colors)
        run: pip install --quiet pillow

      - name: Sync Twitch global badges
        run: python scripts/sync_badges.py

      - name: Commit snapshot changes
        run: |
          # sync_badges.py only rewrites the files when badges actually changed
          if [ -z "$(git status --porcelain data/)" ]; then
            echo "No badge changes detected."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/badges.json data/changelog.json
          git commit -m "Sync Twitch global badges snapshot"
          # Someone may have pushed site changes meanwhile — rebase onto them, then push
          git pull --rebase origin main
          git push
