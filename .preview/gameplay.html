<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#000;font-family:Inter,Arial,sans-serif}
  /* Placeholder for your gameplay capture */
  .game{position:absolute;inset:0;overflow:hidden;
    background:linear-gradient(180deg,#ff7a59 0%,#ff4f8b 32%,#5b2a86 58%,#1b1035 75%,#0b0a14 100%)}
  .sun{position:absolute;left:50%;top:330px;width:420px;height:420px;margin-left:-210px;border-radius:50%;
    background:radial-gradient(circle,#ffd27a,#ff8a5b 60%,transparent 70%);opacity:.9}
  .city{position:absolute;left:0;right:0;bottom:180px;height:360px;display:flex;align-items:flex-end;gap:6px;padding:0 20px}
  .city i{flex:1;background:#140b26;border-top:2px solid rgba(255,90,170,.35)}
  .road{position:absolute;left:0;right:0;bottom:0;height:200px;background:linear-gradient(#120a1f,#050409)}
  .road:before{content:"";position:absolute;left:50%;top:0;bottom:0;width:10px;margin-left:-5px;
    background:repeating-linear-gradient(#ffd27a 0 40px,transparent 40px 90px);animation:lines 1s linear infinite;opacity:.7}
  @keyframes lines{to{background-position:0 90px}}
  .palm{position:absolute;bottom:200px;width:12px;height:420px;background:#0b0614;border-radius:6px}
  .palm:after{content:"";position:absolute;top:-30px;left:-90px;width:190px;height:70px;border-radius:50%;background:#0b0614}
  .label{position:absolute;left:60px;bottom:60px;color:rgba(255,255,255,.55);font-weight:800;font-size:28px;letter-spacing:.2em}
  .widget{position:absolute;inset:0;width:1920px;height:1080px;border:0;background:transparent}
</style></head>
<body>
  <div class="game">
    <div class="sun"></div>
    <div class="city" id="city"></div>
    <div class="palm" style="left:180px"></div><div class="palm" style="left:1680px;height:480px"></div>
    <div class="road"></div>
    <div class="label">YOUR GAMEPLAY</div>
  </div>
  <iframe class="widget" src="https://badgestatus.net/overlay/gta/?v=1" allowtransparency="true"></iframe>
  <script>
    const c=document.getElementById('city');
    for(let i=0;i<60;i++){const b=document.createElement('i');b.style.height=(80+Math.abs(Math.sin(i*1.7))*260)+'px';c.appendChild(b);}
  </script>
</body></html>
