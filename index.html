<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>badgestatus.net</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0d12;
      --card: #131722;
      --border: #23293a;
      --text: #f3f5f9;
      --muted: #9aa3b2;
      --accent: #38bdf8;
      --ok: #22c55e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, #151b2b 0%, var(--bg) 60%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 480px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(34, 197, 94, 0.12);
      border: 1px solid rgba(34, 197, 94, 0.35);
      color: #86efac;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 18px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--ok);
    }

    h1 {
      font-size: 1.75rem;
      letter-spacing: -0.02em;
      margin-bottom: 10px;
    }

    p {
      color: var(--muted);
      line-height: 1.5;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="badge">
      <span class="dot"></span>
      <span>GitHub Pages Connected</span>
    </div>
    <h1>badgestatus.net</h1>
    <p>Site setup is ready. Content coming soon.</p>
  </main>
</body>
</html>
