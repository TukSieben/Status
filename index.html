<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BadgeStatus — Twitch Global Badge Tracker</title>
  <script>
    // Old share links (badgestatus.net/?user=name) now live on the badges page
    (function () {
      var u = new URLSearchParams(location.search).get("user");
      if (u) location.replace("/badges/?user=" + encodeURIComponent(u));
    })();
  </script>
  <meta name="description" content="Track every Twitch global badge: what you can earn right now, what's ending soon, what's coming next, and which ones you're still missing.">
  <meta property="og:title" content="BadgeStatus — Twitch Global Badge Tracker">
  <meta property="og:description" content="Active and upcoming Twitch global badges with a personal missing/owned checker.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://badgestatus.net/">
  <link rel="icon" type="image/png" href="/assets/img/logo.png">
  <link rel="apple-touch-icon" href="/assets/img/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/base.css?v=22">
    <link rel="stylesheet" href="/assets/css/components/cards.css?v=22">
  <link rel="stylesheet" href="/assets/css/components/stream.css?v=21">
  <link rel="stylesheet" href="/assets/css/components/schedule.css?v=21">
  <link rel="stylesheet" href="/assets/css/pages/home.css?v=23">
</head>
<body>
  <div class="bg-waves" id="bgWaves" aria-hidden="true"></div>
  <header class="nav">
    <div class="wrap nav-inner">
      <div class="nav-left">
        <a href="/" class="brand">
          <img src="/assets/img/logo.png" alt="" width="20" height="20">
          <span>BadgeStatus</span>
        </a>
        <span class="nav-sep">/</span>
        <nav class="nav-links">
          <a href="/" class="nav-link is-active">Home</a>
          <a href="/badges/" class="nav-link">Badges</a>
          <a href="/archive/" class="nav-link">Archive</a>
          <a href="#schedule" class="nav-link">Schedule</a>
          <a href="https://www.twitch.tv/badgestatus" target="_blank" rel="noopener noreferrer" class="nav-link nav-stream" data-live-indicator><span class="stream-dot"></span><span data-live-label>Stream</span></a>
        </nav>
      </div>
    </div>
  </header>

  <main class="wrap main home-content">
    <!-- HERO -->
    <section class="panel hero">
      <div class="hero-text">
        <div class="meta-line hero-meta" id="heroMeta">
          <span><b id="heroActive">—</b> available</span>
          <span><b id="heroUpcoming">—</b> upcoming</span>
          <span id="heroNextWrap">next drop <b id="heroNext">—</b></span>
        </div>
        <h1>Which badges are you missing?</h1>

        <form class="hero-form" id="homeForm" autocomplete="off">
          <label class="search-field">
            <span class="search-prefix">twitch.tv/</span>
            <input type="text" id="homeInput" placeholder="your username..." spellcheck="false" aria-label="Twitch username">
          </label>
          <button type="submit" class="btn-white">Check</button>
        </form>
      </div>

      <div class="hero-showcase" id="heroShowcase"></div>
    </section>

    <!-- SCHEDULE -->
    <section class="section" id="schedule">
      <div class="section-head">
        <h2>Schedule</h2>
      </div>
      <div class="panel sched" id="scheduleRoot"></div>
    </section>

    <!-- ENDING / STARTING -->
    <div class="home-cols">
      <section class="section">
        <div class="section-head">
          <h2>Ending soon</h2>
          <a href="/badges/" class="box-link">All →</a>
        </div>
        <div class="mini-list" id="endingList"></div>
      </section>
      <section class="section">
        <div class="section-head">
          <h2>Starting next</h2>
          <a href="/badges/#upcoming" class="box-link">All →</a>
        </div>
        <div class="mini-list" id="startingList"></div>
      </section>
    </div>
  </main>

  </div>

  <footer class="footer">
    <div class="wrap footer-inner">
      <span class="footer-links">badgestatus.net <a href="https://www.twitch.tv/badgestatus" target="_blank" rel="noopener noreferrer" class="footer-stream" data-live-indicator><span class="stream-dot"></span>twitch.tv/badgestatus</a></span>
      <span class="muted" id="footerSync"></span>
    </div>
  </footer>

  <script type="module" src="/assets/js/pages/home.js?v=25"></script>
</body>
</html>
