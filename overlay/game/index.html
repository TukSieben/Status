<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Game badges — BadgeStatus</title>
  <!--
    Gameplay overlay for ONE game (OBS Browser Source: 1920 × 1080, on top of your game capture).
    Shows every badge of that game: free (watch) and paid (sub), with times. Transparent outside the panel.
    Options:
      ?game=PAYDAY 3      → the game (category name as on Twitch)
      ?side=left          → panel on the left (default right)
      ?paid=0             → hide sub badges
      ?theme=sunset       → pink/orange accent (default purple)
    /overlay/gta/ is this page preset for Grand Theft Auto VI.
  -->
  <link rel="icon" type="image/png" href="/assets/img/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/base.css?v=24">
  <link rel="stylesheet" href="/assets/css/pages/game.css?v=1">
</head>
<body class="gm-body">
  <div class="gm-stage" id="stage">
    <aside class="gm-panel" id="gmPanel">
      <div class="gm-accent"></div>
      <header class="gm-head">
        <div class="gm-kicker" id="gmKicker">Badges you can get here</div>
        <h1 class="gm-title" id="gmTitle"></h1>
        <div class="gm-meta" id="gmMeta"></div>
      </header>
      <section class="gm-sec" id="gmFree" hidden>
        <div class="gm-label" id="gmFreeLabel">Free</div>
        <div class="gm-grid" id="gmFreeGrid"></div>
      </section>
      <section class="gm-sec" id="gmPaid" hidden>
        <div class="gm-label">Sub or gift a sub</div>
        <div class="gm-row" id="gmPaidRow"></div>
      </section>
      <div class="gm-empty" id="gmEmpty" hidden>No badges for this game right now.</div>
      <footer class="gm-foot" id="gmFoot"></footer>
    </aside>
  </div>
  <script type="module" src="/assets/js/pages/game.js?v=1"></script>
</body>
</html>
