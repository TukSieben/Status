<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Sidebar — BadgeStatus</title>
  <!--
    Gameplay overlay with a badge sidebar (OBS Browser Source: 1920 × 1080, on top of your game capture).
    The area right of the sidebar is transparent — place your game there.
    Options:
      ?side=right        → sidebar on the right
      ?expired=3         → show badges that ended in the last N days (default 3, 0 = hide)
      ?game=PAYDAY 3     → only badges for that game
      ?brand=0           → hide the BadgeStatus box in the corner
  -->
  <link rel="icon" type="image/png" href="/assets/img/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/base.css?v=22">
  <link rel="stylesheet" href="/assets/css/pages/sidebar.css?v=1">
</head>
<body class="sb-body">
  <div class="sb-stage" id="stage">
    <aside class="sb-panel">
      <div class="sb-scroll" id="sbScroll">
        <div class="sb-track" id="sbTrack"></div>
      </div>
    </aside>
    <div class="sb-brand" id="sbBrand">
      <img src="/assets/img/logo.png" alt="" width="44" height="44">
      <div>
        <div class="sb-brand-name">BadgeStatus</div>
        <div class="sb-brand-url">badgestatus.net</div>
      </div>
    </div>
  </div>
  <script type="module" src="/assets/js/pages/sidebar.js?v=1"></script>
</body>
</html>
